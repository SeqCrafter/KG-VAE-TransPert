seed: 42
data:
  root: data/processed
  features: data/features/mapkg.pt
  split: data/processed/split_drug.json
  batch_size: 16
  num_workers: 4
model:
  latent_dim: 256
  hidden_dim1: 512
  hidden_dim2: 256
  d_model: 256
  nhead: 8
  num_layers: 4
  dim_feedforward: 1024
  dropout: 0.1
  dose_reference_um: 1.0
  activation_checkpointing: false
loss:
  alpha: 1.0
  beta: 0.01
  gamma: 1.0
train:
  device: cuda
  epochs: 200
  lr: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  accumulation_steps: 1
  amp: bf16
  patience: 25
  output: runs/default
